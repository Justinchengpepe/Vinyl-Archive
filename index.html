<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Vinyl Archive</title>
<style>
/* ═══ Design tokens ═══ */
:root{
  --ease:cubic-bezier(0.16,1,0.3,1);
  --gold:#d4a853;
  --accent:#d4a853;
  --r-xs:6px;--r-sm:9px;--r-md:13px;--r-lg:18px;--r-xl:24px;--r-pill:999px;
  --fs-xs:11px;--fs-sm:12px;--fs-md:13.5px;--fs-lg:15px;--fs-xl:17px;
  --bar-h:64px;
  --gutter:clamp(18px,3.2vw,34px);
}
[data-theme="light"]{
  --bg:#ffffff;--surface:#ffffff;--surface-2:#f5f4f1;--surface-3:#e9e7e1;
  --glass:rgba(255,255,255,0.82);--glass-2:rgba(255,255,255,0.95);
  --line:rgba(17,16,13,0.085);--line-2:rgba(17,16,13,0.16);
  --tx:#131210;--tx-2:rgba(19,18,16,0.60);--tx-3:rgba(19,18,16,0.40);
  --hover:rgba(19,18,16,0.045);
  --sh-1:0 1px 2px rgba(19,18,16,.05);
  --sh-2:0 4px 18px rgba(19,18,16,.09),0 1px 3px rgba(19,18,16,.05);
  --sh-3:0 22px 60px rgba(19,18,16,.16),0 2px 10px rgba(19,18,16,.06);
  --vig:radial-gradient(ellipse 92% 84% at 50% 46%,transparent 58%,rgba(19,18,16,.06) 100%);
  --scrim:rgba(255,255,255,0.55);
}
[data-theme="dark"]{
  --bg:#0d0d14;--surface:#15151d;--surface-2:#1c1c25;--surface-3:#282833;
  --glass:rgba(15,15,22,0.74);--glass-2:rgba(20,20,29,0.94);
  --line:rgba(255,255,255,0.09);--line-2:rgba(255,255,255,0.18);
  --tx:#f3f2ef;--tx-2:rgba(243,242,239,0.60);--tx-3:rgba(243,242,239,0.38);
  --hover:rgba(255,255,255,0.06);
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 6px 22px rgba(0,0,0,.5);
  --sh-3:0 26px 68px rgba(0,0,0,.62);
  --vig:radial-gradient(ellipse 92% 84% at 50% 46%,transparent 52%,rgba(0,0,0,.58) 100%);
  --scrim:rgba(13,13,20,0.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
ul{list-style:none}
img{display:block;max-width:100%}
svg{display:block}
body{background:var(--bg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:var(--fs-md);color:var(--tx);line-height:1.45;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;height:100vh;height:100dvh;cursor:default;transition:background .6s var(--ease);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}

/* ═══ Stage ═══ */
#c{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity .8s var(--ease)}
#c canvas{display:block}
#c.visible{opacity:1}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:var(--vig);transition:background .6s var(--ease)}

/* ═══ Top bar ═══ */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:1100;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 var(--gutter);pointer-events:none;transition:opacity .45s var(--ease)}
body.lyr-open .brand{opacity:0;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;pointer-events:auto;transition:opacity .35s var(--ease)}
.brand-mark{width:21px;height:21px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 50% 50%,var(--accent) 0 20%,#15151b 21% 38%,#2b2b35 39% 49%,#15151b 50% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),var(--sh-1)}
.brand-name{font-size:var(--fs-sm);font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--tx-2);white-space:nowrap}
.tb-actions{display:flex;align-items:center;gap:9px;pointer-events:auto;min-width:0}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh-1);font-size:var(--fs-sm);font-weight:500;letter-spacing:-0.005em;color:var(--tx);max-width:min(38vw,240px);transition:border-color .28s var(--ease),transform .28s var(--ease),box-shadow .28s var(--ease)}
.chip:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh-2)}
.chip:active{transform:translateY(0) scale(.985)}
.chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--accent);transition:background .4s var(--ease)}
.chip .l-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--tx-3);transition:background .3s var(--ease),box-shadow .3s var(--ease)}
#login-btn.on .l-dot{background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.2)}
#artist-btn{display:none}
body.picked #artist-btn{display:flex}
.icon-btn{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh-1);display:flex;align-items:center;justify-content:center;color:var(--tx-2);transition:color .28s var(--ease),border-color .28s var(--ease),transform .28s var(--ease),box-shadow .28s var(--ease)}
.icon-btn:hover{color:var(--tx);border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh-2)}
.icon-btn:active{transform:translateY(0) scale(.94)}

/* ═══ Stage captions ═══ */
#hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;color:var(--tx-3);font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;text-align:center;transition:opacity .5s var(--ease)}
#alabel{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;color:var(--tx);font-size:var(--fs-xl);font-weight:600;letter-spacing:-0.02em;text-align:center;opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease),color .6s var(--ease);white-space:pre-line}
#alabel.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
#alabel .yr{display:block;font-size:var(--fs-xs);font-weight:500;opacity:.45;margin-top:5px;letter-spacing:.1em}
#swipe-hint{display:none}

/* ═══ Loading ═══ */
#loading-msg{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;pointer-events:none;opacity:0;transition:opacity .35s var(--ease)}
#loading-msg.on{opacity:1}
#loading-msg::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,var(--load-accent,var(--accent)) 0%,transparent 52%);opacity:.1;animation:loadBreathe 4.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes loadBreathe{from{opacity:.05}to{opacity:.15}}
.load-vinyl{width:60px;height:60px;border-radius:50%;position:relative;background:#0b0b0d;box-shadow:0 16px 40px rgba(0,0,0,.28);animation:loadSpin 1.15s linear infinite;display:flex;align-items:center;justify-content:center}
.load-vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at center,#0d0d10 0,#0d0d10 1.3px,#1c1c22 1.9px,#0d0d10 2.3px);opacity:.8}
.load-label{width:24px;height:24px;border-radius:50%;background:var(--gold);position:relative;z-index:1;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.load-label::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#0b0b0d;top:50%;left:50%;transform:translate(-50%,-50%)}
.load-text{font-size:var(--fs-sm);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--tx-2)}
@keyframes loadSpin{to{transform:rotate(360deg)}}

/* ═══ Album panel ═══ */
#panel{position:fixed;top:var(--bar-h);right:0;bottom:0;width:52%;max-width:460px;z-index:80;background:var(--glass-2);-webkit-backdrop-filter:blur(40px) saturate(1.5);backdrop-filter:blur(40px) saturate(1.5);border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:var(--r-xl) 0 0 0;box-shadow:var(--sh-3);transform:translateX(100%);transition:transform .55s var(--ease),background .6s var(--ease);display:flex;flex-direction:column;overflow:hidden}
#panel.on{transform:translateX(0)}
.ph{position:relative;flex-shrink:0;padding:22px 22px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;overflow:hidden}
.ph::before{content:"";position:absolute;inset:-30%;background-image:var(--ph-bg,none);background-size:cover;background-position:center;filter:blur(46px) saturate(1.7);opacity:.22;z-index:0;pointer-events:none}
.ph::after{content:"";position:absolute;inset:0;background:var(--scrim);z-index:0;pointer-events:none}
.ph-art{position:relative;z-index:1;width:56px;height:56px;border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;background:var(--surface-2);box-shadow:var(--sh-2)}
.ph-art img{width:100%;height:100%;object-fit:cover}
.ph-meta{position:relative;z-index:1;min-width:0;flex:1}
.ph-kicker{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx-3);font-weight:600;margin-bottom:6px}
.ph h2{font-size:var(--fs-xl);font-weight:600;letter-spacing:-0.022em;line-height:1.24;color:var(--tx);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ph-meta #py{display:block;font-size:var(--fs-sm);color:var(--tx-2);margin-top:5px;font-weight:500}
#tracks{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 0 10px}
#tracks::-webkit-scrollbar{width:11px}
#tracks::-webkit-scrollbar-track{background:transparent}
#tracks::-webkit-scrollbar-thumb{background:var(--line-2);border:4px solid transparent;background-clip:content-box;border-radius:99px}
.trk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 22px;cursor:pointer;color:var(--tx-2);font-size:var(--fs-md);transition:background .16s var(--ease),color .16s var(--ease)}
.trk:hover{background:var(--hover);color:var(--tx)}
.trk .n{font-size:var(--fs-xs);font-weight:500;text-align:right;color:var(--tx-3);font-variant-numeric:tabular-nums;transition:color .16s var(--ease)}
.trk .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-0.005em}
.trk .td{font-size:var(--fs-xs);color:var(--tx-3);font-variant-numeric:tabular-nums;transition:color .16s var(--ease)}
.trk.play{color:var(--accent);background:var(--hover)}
.trk.play .n{color:var(--accent);font-weight:600}
.trk.play .td{color:var(--accent);opacity:.7}
.trk.off{opacity:.28;pointer-events:none}
.pp{flex-shrink:0;border-top:1px solid var(--line);padding:14px 22px 18px;background:var(--glass-2);display:flex;flex-direction:column;gap:12px}
.np{display:flex;align-items:center;gap:11px;min-width:0}
.np-art{width:38px;height:38px;border-radius:var(--r-xs);overflow:hidden;flex-shrink:0;background:var(--surface-2);box-shadow:var(--sh-1)}
.np-art img{width:100%;height:100%;object-fit:cover}
.np-info{min-width:0;flex:1}
.np-title{font-size:var(--fs-md);font-weight:600;color:var(--tx);letter-spacing:-0.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-artist{font-size:var(--fs-xs);color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.pp-row{display:flex;align-items:center;gap:12px}
#play-btn{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--sh-2);transition:transform .24s var(--ease),background .4s var(--ease)}
#play-btn:hover{transform:scale(1.07)}
#play-btn:active{transform:scale(.95)}
.progress{flex:1;height:5px;border-radius:99px;background:var(--surface-3);cursor:pointer;position:relative}
.progress-fill{height:100%;border-radius:99px;background:var(--accent);width:0%;transition:background .4s var(--ease);position:relative}
.progress-fill::after{content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%) scale(.4);width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25);opacity:0;transition:opacity .2s var(--ease),transform .2s var(--ease)}
#progress:hover .progress-fill::after,#progress.playing .progress-fill::after{opacity:1;transform:translateY(-50%) scale(1)}
.time{font-size:var(--fs-xs);color:var(--tx-3);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:36px;text-align:right}
#eq{display:none;gap:2.5px;align-items:flex-end;height:16px;flex-shrink:0}
#eq.on{display:flex}
#eq i{width:2.5px;background:var(--accent);border-radius:1px;animation:eqPulse .62s ease-in-out infinite alternate}
#eq i:nth-child(1){height:45%;animation-delay:0s}
#eq i:nth-child(2){height:100%;animation-delay:.16s}
#eq i:nth-child(3){height:62%;animation-delay:.08s}
#eq i:nth-child(4){height:84%;animation-delay:.24s}
@keyframes eqPulse{to{transform:scaleY(.34)}}

/* ═══ Lyric scene ═══ */
#lyric-scene{position:fixed;inset:0;z-index:90;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .6s var(--ease);overflow:hidden}
#lyric-scene.on{opacity:1;pointer-events:auto}
#lyric-scene::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 44%,var(--lyr-accent,var(--accent)) 0%,transparent 54%);opacity:.1;pointer-events:none;animation:lyrBreathe 7s ease-in-out infinite alternate}
@keyframes lyrBreathe{from{opacity:.055}to{opacity:.15}}
#lyric-scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 120% 92% at 50% 46%,transparent 38%,rgba(0,0,0,.28) 100%);pointer-events:none}
.lyr-vinyl-wrap{transition:opacity .55s var(--ease) .1s,transform .6s var(--ease) .1s}
.lyr-lyrics{transition:opacity .55s var(--ease) .18s,transform .6s var(--ease) .18s}
.lyr-now{transition:opacity .5s var(--ease) .25s,transform .5s var(--ease) .25s}
.lyr-controls{transition:opacity .5s var(--ease) .35s}
.lyr-progress{transition:opacity .5s var(--ease) .35s}
#lyric-scene:not(.on) .lyr-vinyl-wrap{opacity:0;transform:translateY(-50%) scale(.92)}
#lyric-scene:not(.on) .lyr-lyrics{opacity:0;transform:translateY(-50%) scale(.97)}
#lyric-scene:not(.on) .lyr-now{opacity:0;transform:translateY(-16px)}
#lyric-scene:not(.on) .lyr-controls{opacity:0}
#lyric-scene:not(.on) .lyr-progress{opacity:0}
.lyr-close{position:fixed;top:14px;left:var(--gutter);z-index:6;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh-1);display:flex;align-items:center;justify-content:center;color:var(--tx-2);opacity:0;transform:scale(.9);transition:color .28s var(--ease),border-color .28s var(--ease),opacity .4s var(--ease),transform .4s var(--ease)}
#lyric-scene.on .lyr-close{opacity:1;transform:scale(1)}
#lyric-scene.on .lyr-close:hover{color:var(--tx);border-color:var(--line-2);transform:scale(1.08)}
.lyr-vinyl-wrap{position:absolute;right:2vw;top:50%;transform:translateY(-50%);width:min(46vh,42vw);aspect-ratio:1;z-index:2}
.lyr-vinyl{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.42);will-change:transform}
.lyr-vinyl.tremble{animation:vinylTremble .32s ease-out}
@keyframes vinylTremble{0%{transform:rotate(0)}20%{transform:rotate(2deg) translateX(1px)}40%{transform:rotate(-1deg)}60%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
.lyr-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,0.08) 16deg,rgba(255,255,255,0) 32deg);pointer-events:none;z-index:3;mix-blend-mode:screen}
.lyr-particle{position:absolute;border-radius:50%;background:var(--lyr-accent,var(--accent));pointer-events:none;opacity:0;animation:particleFloat linear infinite;z-index:2}
@keyframes particleFloat{0%{transform:translateY(0);opacity:0}15%{opacity:.5}80%{opacity:.25}100%{transform:translateY(-140px);opacity:0}}
.lyr-vinyl-wrap::after{content:"";position:absolute;left:50%;top:94%;transform:translateX(-50%);width:146%;height:22%;background:radial-gradient(ellipse at center,rgba(0,0,0,.42),transparent 70%);pointer-events:none;z-index:1}
.lyr-vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at center,#0c0c10 0,#0c0c10 1.6px,#1a1a20 2.4px,#0c0c10 3px)}
.lyr-vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 200deg,transparent 0deg,rgba(255,255,255,0.12) 30deg,transparent 90deg,rgba(255,255,255,0.05) 210deg,transparent 260deg)}
.lyr-label{width:34%;height:34%;border-radius:50%;background:var(--lyr-accent,var(--accent));position:relative;z-index:2;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.08)}
.lyr-label::after{content:"";position:absolute;width:8%;height:8%;border-radius:50%;background:#0b0b0d}
.lyr-tonearm{position:absolute;top:6%;right:-6%;width:70%;height:6px;background:linear-gradient(90deg,#3a3a40,#8a8a92);border-radius:4px;transform-origin:100% 50%;transform:rotate(-19deg);transition:transform .45s linear;z-index:3;pointer-events:auto;touch-action:none;cursor:grab}
.lyr-tonearm:active{cursor:grabbing}
.lyr-tonearm::before{content:"";position:absolute;right:-10px;top:-9px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#777,#202024);box-shadow:0 3px 10px rgba(0,0,0,.5)}
.lyr-tonearm::after{content:"";position:absolute;left:-10px;top:50%;width:18px;height:4px;background:#b8b8c0;border-radius:2px;transform:translateY(-50%) rotate(30deg)}
.lyr-lyrics{position:absolute;left:2vw;top:50%;transform:translateY(-50%);width:66vw;max-width:960px;height:70vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;display:flex;flex-direction:column;align-items:flex-start;padding:29vh 0;z-index:4;-webkit-mask-image:linear-gradient(transparent,black 11%,black 89%,transparent);mask-image:linear-gradient(transparent,black 11%,black 89%,transparent)}
.lyr-lyrics::-webkit-scrollbar{display:none}
.lyr-inner{display:flex;flex-direction:column;align-items:flex-start;width:100%}
.lyr-line{display:block;text-align:left;padding:5px 0;color:var(--tx-2);opacity:.34;transition:opacity .4s var(--ease),color .4s var(--ease),transform .5s var(--ease);font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.5;font-weight:500;letter-spacing:-0.014em;transform:scale(.82);transform-origin:left center}
.lyr-line.cur{opacity:1;color:var(--tx);font-weight:600;transform:scale(1.14)}
.lyr-controls{position:absolute;bottom:7%;left:7vw;z-index:6;display:flex;gap:12px}
.lyr-ctl{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh-1);display:flex;align-items:center;justify-content:center;color:var(--tx-2);transition:color .28s var(--ease),border-color .28s var(--ease),transform .28s var(--ease)}
.lyr-ctl:hover{color:var(--tx);border-color:var(--line-2);transform:translateY(-1px)}
.lyr-ctl:active{transform:scale(.94)}
.lyr-play-ctl{width:52px;height:52px;background:var(--lyr-accent,var(--accent));border-color:transparent;color:#fff;box-shadow:var(--sh-2)}
.lyr-play-ctl:hover{color:#fff;border-color:transparent;transform:scale(1.06)}
.lyr-progress{position:absolute;left:50%;transform:translateX(-50%);bottom:-56px;width:78%;display:flex;align-items:center;gap:12px;z-index:6}
.lyr-bar{flex:1;height:5px;background:var(--surface-3);border-radius:99px;cursor:pointer;position:relative;touch-action:none}
.lyr-bar-fill{height:100%;background:var(--lyr-accent,var(--accent));border-radius:99px;width:0%;position:relative;transition:background .4s var(--ease)}
.lyr-bar-fill::after{content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:var(--lyr-accent,var(--accent));box-shadow:0 1px 4px rgba(0,0,0,.3)}

const NC_KEY='vinyl_nc';
function getNc(){try{return JSON.parse(localStorage.getItem(NC_KEY)||'null')||{}}catch(e){return {}}}

// ═══ API HELPERS ═══
async function api(url,opt){
  const ck=getNc().cookie;
  const init=Object.assign({},opt||{});
  if(ck){init.headers=Object.assign({},init.headers||{},{'X-Netease-Cookie':encodeURIComponent(ck)})}
  const r=await fetch(url,init);
  if(!r.ok)throw new Error(r.status);
  return r.json();
}

function syncLyric(){if(lyrScene.classList.contains('on'))lyricsController.sync(playback.currentTime+playback.lyricOffset);}
function spawnParticles(){
  const sc=document.getElementById('lyric-scene');
  for(let i=0;i<18;i++){
    const p=document.createElement('div');p.className='lyr-particle';
    const size=2+Math.random()*4;
    p.style.width=size+'px';p.style.height=size+'px';
    p.style.left=(Math.random()*100)+'%';
    p.style.bottom=(Math.random()*65+8)+'%';
    p.style.animationDuration=(7+Math.random()*9)+'s';
    p.style.animationDelay=(Math.random()*8)+'s';
    sc.appendChild(p);
  }
}
spawnParticles();
document.getElementById('lyr-close').addEventListener('click',hideLyric);
lyrScene.addEventListener('pointerdown',e=>e.stopPropagation());
lyrScene.addEventListener('pointerup',e=>e.stopPropagation());

// ═══ CUSTOM PLAYER ═══
const playBtn=document.getElementById('play-btn'),progress=document.getElementById('progress'),progressFill=document.getElementById('progress-fill'),timeDisplay=document.getElementById('time-display');
function paintPlayIcon(){playBtn.innerHTML=playback.paused?ICON.play:ICON.pause}
paintPlayIcon();
playBtn.addEventListener('click',()=>{if(playback.src){if(playback.paused)playback.play();else playback.pause()}else{const tracks=albumTracks[currentAlbum?.id];if(tracks?.length)plT(tracks[0],0,tl.children[0]);}});
playback.addEventListener('play',()=>{paintPlayIcon();document.getElementById('eq').classList.add('on');progress.classList.add('playing')});
playback.addEventListener('pause',()=>{paintPlayIcon();document.getElementById('eq').classList.remove('on');progress.classList.remove('playing')});
playback.addEventListener('timeupdate',()=>{if(playback.duration){progressFill.style.width=(playback.currentTime/playback.duration*100)+'%';timeDisplay.textContent=fmtDur(playback.currentTime*1000)}syncLyric();syncLyrProgress()});
playback.addEventListener('loadedmetadata',()=>{progressFill.style.width='0%';timeDisplay.textContent='0:00'});
playback.addEventListener('ended',()=>{paintPlayIcon();progressFill.style.width='0%';timeDisplay.textContent='0:00';document.getElementById('eq').classList.remove('on');switchTrack(1)});
progress.addEventListener('click',e=>{if(!playback.duration)return;const r=progress.getBoundingClientRect();playback.currentTime=((e.clientX-r.left)/r.width)*playback.duration});
function showArtistPicker(){

let introHideTimer;

// ═══ INPUT ═══
const rc=new THREE.Raycaster();const ms=new THREE.Vector2(-999,-999);let pd=false,pm=false;const ps={x:0,y:0};const ct=document.getElementById('c');
ct.addEventListener('pointermove',e=>{const r=ct.getBoundingClientRect();ms.x=((e.clientX-r.left)/r.width)*2-1;ms.y=-((e.clientY-r.top)/r.height)*2+1;if(pd&&(Math.abs(e.clientX-ps.x)>3||Math.abs(e.clientY-ps.y)>3))pm=true});
ct.addEventListener('pointerdown',e=>{pd=true;pm=false;ps.x=e.clientX;ps.y=e.clientY;const r=ct.getBoundingClientRect();ms.x=((e.clientX-r.left)/r.width)*2-1;ms.y=-((e.clientY-r.top)/r.height)*2+1;});
document.addEventListener('pointerup',()=>{if(pd&&!pm)clk();pd=false});
ct.addEventListener('pointerleave',()=>{if(!pd){ms.set(-999,-999);if(view==='IDLE'){hi=-1;cards.forEach(c=>c.vty=VDF);alabel.classList.remove('on')}ct.style.cursor='default'}});
ct.addEventListener('wheel',e=>{if(view!=='IDLE'||!albums.length)return;e.preventDefault();tfi-=e.deltaY*0.002;lastScroll=performance.now();clearTimeout(window._st);window._st=setTimeout(()=>{tfi=Math.round(tfi);lastScroll=0},250)},{passive:false});
// 移动端触摸滑动（专辑轮播）
let tsX=0,tsY=0,tsActive=false;
ct.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;tsActive=true;},{passive:true});
ct.addEventListener('touchmove',e=>{if(!tsActive||view!=='IDLE'||!albums.length)return;const dx=e.touches[0].clientX-tsX,dy=e.touches[0].clientY-tsY;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10){tfi-=dx*0.008;lastScroll=performance.now();tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;hideSwipeHint();}else if(Math.abs(dy)>Math.abs(dx)){tsActive=false;}e.preventDefault()},{passive:false});
ct.addEventListener('touchend',()=>{tsActive=false;if(lastScroll>0)lastScroll=performance.now();});
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open],#login-modal.on')||e.target.matches('input,textarea,select')||document.getElementById('intro').style.display!=='none')return;
  if(e.key==='Escape'){e.preventDefault();if(lyrScene.classList.contains('on')){hideLyric();}else if(view==='SELECTED'){if(albumSleeve.side==='back')albumSleeve.flip();else desel()}}
  if(e.key==='Enter'&&view==='SELECTED'&&sel&&!lyrScene.classList.contains('on')&&!e.target.closest?.('button,a,[contenteditable]')){e.preventDefault();const tks=tl.children;if(tks.length>0){tks[0].click()}}
  if(view==='IDLE'&&albums.length){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();tfi=Math.round(tfi)+1;lastScroll=0}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();tfi=Math.round(tfi)-1;lastScroll=0}}
});
window.addEventListener('resize',()=>{const w=window.innerWidth,h=window.innerHeight;camZ=w<768?CAM_MOB:CAM_DESK;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()});

// ═══ HOVER ═══
let hdb=0,hdp=-1;
function uHov(){
  if(view!=='IDLE'||!albums.length)return;
  rc.setFromCamera(ms,camera);const hts=rc.intersectObjects(cards.map(c=>c.g),true);let nh=-1;
  if(hts.length>0){let o=hts[0].object;for(let i=0;i<12&&o;i++){const ix=cards.findIndex(c=>c.g===o);if(ix>=0){nh=ix;break}o=o.parent}}
  if(nh!==hdp){hdp=nh;hdb=0}else{hdb++;if(hdb>=3&&nh!==hi){hi=nh;cards.forEach((c,i)=>{c.vty=i===nh?VHO:VDF});ct.style.cursor=nh>=0?'pointer':'default';if(nh>=0){const a=albums[nh];alabel.innerHTML=(a.name||'').replace(/\n/g,'<br>')+'<span class=yr>'+(a.publishTime?new Date(a.publishTime).getFullYear():'')+'</span>';alabel.classList.add('on')}else alabel.classList.remove('on')}}
}

// ═══ SELECT/DESELECT ═══
function selc(ix){if(view!=='IDLE'||ix<0||ix>=albums.length)return;si=ix;sel=cards[ix];currentAlbum=albums[ix];view='SELECTING';sel.drawFrom=sel.v.position.y;hi=-1;hdp=-1;hdb=0;tp=0;hem=false;hint.style.opacity='0';alabel.classList.remove('on');ct.style.cursor='default';burstP(sel.rx,sel.ry+1,sel.rz);blendBg(currentAlbum.color||(currentArtist?currentArtist.color:'#888'),theme==='dark')}
function desel(){if(view!=='SELECTED')return;beginSleeveReturn(sel);view='DESELECTING';tp=0;hiP();if(currentArtist)blendBg(currentArtist.color,theme==='dark');else resetBg(theme==='dark');document.getElementById('eq').classList.remove('on')}
function hitTest(){
  if(ms.x<=-900)return -1;
  rc.setFromCamera(ms,camera);
  const hts=rc.intersectObjects(cards.map(c=>c.g),true);
  if(!hts.length)return -1;
  let o=hts[0].object;
  for(let i=0;i<12&&o;i++){const ix=cards.findIndex(c=>c.g===o);if(ix>=0)return ix;o=o.parent}
  return -1;
}
function clk(){
  if(view==='SELECTED'){if(hitTest()===si)albumSleeve.inspect();else desel();return}
  if(view!=='IDLE')return;
  let idx=hi>=0?hi:hitTest();
  if(idx>=0)selc(idx);
}

// ═══ CHOREO ═══
function chSel(dt){
  const c=sel;if(!c)return;
  tp+=dt/1.4;const p=Math.min(1,tp),t=ae(Math.min(1,p/0.6));
  const mob=window.innerWidth<768;
  const sx=mob?0:-3.5,sy=mob?0.95:0.12,sz=2.2,sc=mob?1.1:1.4,cx=mob?0:-2.2,cy=mob?0.1:0.08,cz=mob?8.6:6.2;
  cards.forEach((cc,i)=>{
    if(i===si){
      cc.g.position.lerpVectors(new THREE.Vector3(cc.rx,cc.ry,cc.rz),new THREE.Vector3(sx,sy,sz),t);
      cc.g.scale.setScalar(lr(1,sc,t));cc.g.rotation.y=lr(cc.rry,-Math.PI*2,t);
    }else{
      cc.g.rotation.y=lr(cc.rry,cc.rry+Math.PI,t);fadeCard(cc,1-ae(Math.min(1,p/0.06)));
      if(p>0.06)cc.g.visible=false;
    }
  });
  if(p<=0.25){
    const vt=ae(p/0.25);c.v.position.y=lr(c.drawFrom,2.4,vt);
    c.v.children.forEach(ch=>{if(ch.material)ch.material.opacity=lr(1,0,vt)});
  }else c.v.visible=false;
  if(p<=0.65)camera.position.lerpVectors(new THREE.Vector3(0,0.55,camZ),new THREE.Vector3(cx,cy,cz),ae(p/0.65));
  if(p>=0.3&&!hem){hem=true;shP(currentAlbum);popT(currentAlbum)}
  if(p>=1){view='SELECTED';tp=0;c.g.position.set(sx,sy,sz);c.g.scale.setScalar(sc);c.g.rotation.y=0}
}

function chDes(dt){
  const c=sel;if(!c)return;
  if(!settleSleeveReturn(c,dt,window.matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  tp+=dt/1.7;const p=Math.min(1,tp),t=ae(Math.min(1,p/0.6));
  const mob=window.innerWidth<768;
  const sx=mob?0:-3.5,sy=mob?0.95:0.12,sz=2.2,sc=mob?1.1:1.4,cx=mob?0:-2.2,cy=mob?0.1:0.08,cz=mob?8.6:6.2;
  cards.forEach((cc,i)=>{
    if(i===si){
      cc.g.position.lerpVectors(new THREE.Vector3(sx,sy,sz),new THREE.Vector3(cc.rx,cc.ry,cc.rz),t);
      cc.g.scale.setScalar(lr(sc,1,t));
      cc.g.rotation.y=lr(c.returnMotion.groupFrom,c.returnMotion.groupTo,t);
    }else{
      if(p>0.25){cc.g.visible=true;fadeCard(cc,ae(Math.min(1,(p-0.25)/0.75)))}
      cc.g.rotation.y=lr(cc.rry+Math.PI,cc.rry,t);
    }
  });
  // Child sleeve is now flush with its disc; move the whole assembly together.
  c.v.visible=true;
  const vt=ae(Math.min(1,p/0.35));c.v.position.y=lr(2.4,VDF,vt);
  c.v.children.forEach(ch=>{if(ch.material)ch.material.opacity=vt});
  if(p<=0.65)camera.position.lerpVectors(new THREE.Vector3(cx,cy,cz),new THREE.Vector3(0,0.55,camZ),ae(p/0.65));
  if(p>=1){
    view='IDLE';si=-1;tp=0;hem=false;sel=null;currentAlbum=null;
    cards.forEach(cc=>{cc.returnMotion=null;cc.enterT=1;cc.g.visible=true;cc.mesh.rotation.y=0;cc.flipAngle=cc.flipTarget=0;cc.g.rotation.y=cc.rry;cc.g.scale.setScalar(1);cc.vty=VDF;cc.v.visible=true;fadeCard(cc,1)});
    setCards(fi,true);hint.style.opacity='1';
  }
}

// HTML track controls share the physical sleeve's back plane, camera and rotation.
const sleevePlane=new THREE.Matrix4().makeRotationY(Math.PI)
  .multiply(new THREE.Matrix4().makeTranslation(-AW/2,AH/2,SLEEVE_DEPTH/2+.002))
  .multiply(new THREE.Matrix4().makeScale(AW/640,-AH/640,1));
const sleeveClip=new THREE.Matrix4(),sleeveNormal=new THREE.Vector3(),sleevePosition=new THREE.Vector3(),sleeveEye=new THREE.Vector3(),sleeveOrigin=new THREE.Vector4(),sleeveRight=new THREE.Vector4();
function syncSleeveProjection(){
  if(!sel||view!=='SELECTED'){albumSleeve.updateProjection(null,false);return;}
  sleeveClip.copy(camera.projectionMatrix).multiply(camera.matrixWorldInverse).multiply(sel.mesh.matrixWorld).multiply(sleevePlane);
  sleeveNormal.set(0,0,-1).transformDirection(sel.mesh.matrixWorld);
  sleevePosition.setFromMatrixPosition(sel.mesh.matrixWorld);sleeveEye.copy(camera.position).sub(sleevePosition).normalize();
  sleeveOrigin.set(0,0,0,1).applyMatrix4(sleeveClip);sleeveRight.set(640,0,0,1).applyMatrix4(sleeveClip);
  const projectedWidth=Math.hypot((sleeveRight.x/sleeveRight.w-sleeveOrigin.x/sleeveOrigin.w)*window.innerWidth/2,(sleeveRight.y/sleeveRight.w-sleeveOrigin.y/sleeveOrigin.w)*window.innerHeight/2);
  albumSleeve.updateProjection(sleeveScreenTransform(sleeveClip.elements,window.innerWidth,window.innerHeight),sleeveNormal.dot(sleeveEye)>.02,Math.max(1,Math.min(4,480/projectedWidth)));
}

// ═══ LOOP ═══
const clock=new THREE.Clock();clock.getDelta();
function upd(){const dt=Math.min(clock.getDelta(),0.05);if(dt<=0.001){requestAnimationFrame(upd);return}
  if(view==='IDLE'&&albums.length){
    if(lastScroll>0&&performance.now()-lastScroll>250){tfi=Math.round(tfi);lastScroll=0}
    if(lastScroll===0&&Math.abs(tfi-Math.round(tfi))<0.02)tfi=Math.round(tfi);
    fi+=lr(0,tfi-fi,Math.min(3.5*dt,1));
    cards.forEach(c=>{const p=cPos(c.ix,fi);c.rx=p.x;c.ry=p.y;c.rz=p.z;c.rry=p.ry;const dx=p.x-c.g.position.x,dy=p.y-c.g.position.y,dz=p.z-c.g.position.z,dr=p.ry-c.g.rotation.y;if(Math.abs(dx)>0.0005)c.g.position.x+=dx*6*dt;else c.g.position.x=p.x;if(Math.abs(dy)>0.0005)c.g.position.y+=dy*6*dt;else c.g.position.y=p.y;if(Math.abs(dz)>0.0005)c.g.position.z+=dz*6*dt;else c.g.position.z=p.z;if(Math.abs(dr)>0.0003)c.g.rotation.y+=dr*6*dt;else c.g.rotation.y=p.ry;if(c.enterT<1){c.enterT=Math.min(1,c.enterT+dt*1.4);const e=c.enterT<=0?0:ae(Math.min(1,c.enterT));c.g.scale.setScalar(lr(0.85,1,e));}moveSleeveVinyl(c,c.vty,dt);});
    camera.position.lerp(new THREE.Vector3(0,0.55,camZ),2.5*dt);
  }
  if((view==='SELECTING'||view==='DESELECTING')&&!sel){view='IDLE';si=-1;sel=null;currentAlbum=null;cards.forEach(cc=>{cc.g.visible=true;cc.mesh.rotation.y=0;cc.flipAngle=cc.flipTarget=0;cc.g.rotation.y=cc.rry;cc.g.scale.setScalar(1);cc.vty=VDF;cc.v.visible=true;fadeCard(cc,1)});setCards(fi,true)}
  uHov();if(view==='SELECTING')chSel(dt);if(view==='DESELECTING')chDes(dt);
  if(sel&&view!=='DESELECTING'){
    const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    sel.flipAngle=reduced?sel.flipTarget:lr(sel.flipAngle,sel.flipTarget,1-Math.exp(-7*dt));
    if(Math.abs(sel.flipAngle-sel.flipTarget)<.001)sel.flipAngle=sel.flipTarget;
    sel.mesh.rotation.y=sel.flipAngle;
  }
  if(view==='SELECTED'&&sel&&cNe)sel.v.rotation.z+=dt*2.5;
  bgCurrent.lerp(bgTarget,4*dt);scene.background.copy(bgCurrent);scene.fog.color.copy(bgCurrent);bgSphere.material.color.copy(bgCurrent);bgSphere.rotation.z+=dt*0.14;
  const pa=pts.geometry.attributes.position;for(let i=0;i<pa.count;i++){const ny=pa.getY(i)+(0.2+Math.random()*0.3)*dt;pa.setY(i,ny>6?-4:ny);pa.setX(i,pa.getX(i)+(Math.random()-0.5)*0.2*dt);pa.setZ(i,pa.getZ(i)+(Math.random()-0.5)*0.2*dt)}pa.needsUpdate=true;
  pts.material.color.copy(bgCurrent).multiplyScalar(0.15).offsetHSL(0.08,0,0);
  updateVinyl(dt);
  renderer.render(scene,camera);syncSleeveProjection();requestAnimationFrame(upd);
}
